name: Kotlin SDK

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Tests, public API baseline, and smoke compilation
        run: ./gradlew check compileSmokeKotlin --no-daemon
      - name: Build and run a separate SDK consumer
        run: ./gradlew -p compatibility/consumer run --no-daemon
